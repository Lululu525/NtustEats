<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台科大學生餐廳 · NTUST Eats</title>
<meta name="theme-color" content="#d6336c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="台科學餐">
<meta name="description" content="台灣科技大學學生餐廳線上點餐：上課前先點好，下課直接拿。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --ink:#1d1b1e; --ink2:#55505a; --mute:#8b8590; --line:#ebe5e8; --bg:#faf7f8; --card:#fff;
  --brand:#d6336c; --brand-d:#a51d4f; --peach:#fbe3dc; --peach-d:#f3c9bd;
  --ok:#2f8f5b; --ok-bg:#e6f4ec; --warn:#b7791f; --warn-bg:#fdf3e1; --bad:#c53030; --bad-bg:#fde8e8;
  --r:14px; --sh:0 1px 2px rgba(30,20,30,.06),0 4px 14px rgba(30,20,30,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#e9e3e6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit}
.hidden{display:none!important}

/* ---------- top bar (demo role switch) ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--ink);color:#fff}
.topbar .logo{font-weight:800;letter-spacing:.3px}
.topbar .logo b{color:#ff8fb3}
.topbar .tag{font-size:12px;opacity:.7}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;font-size:13px}
.who .me{opacity:.85;text-align:right;line-height:1.3}
.who .me small{display:block;opacity:.7;font-size:11px}
.who .out{padding:6px 12px;border-radius:999px;background:#38333a;color:#eee;font-size:13px}
.mswitch{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;background:#38333a;color:#eee;font-size:13px}
.mswitch .track{width:34px;height:20px;border-radius:10px;background:#6b6470;position:relative;transition:.15s}
.mswitch .track:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.mswitch.on{background:#ff8fb3;color:var(--ink);font-weight:700}
.mswitch.on .track{background:var(--brand)}
.mswitch.on .track:after{left:16px}
.mform{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#fff;border-radius:12px;padding:14px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
@media (max-width:860px){.mform{grid-template-columns:1fr 1fr}}
.mform .field input,.mform .field select{padding:8px 10px}
table.t input.w{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:6px}
.catbar{display:flex;gap:8px;align-items:center;margin:18px 0 8px}
.catbar input{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-weight:700}
.seg{display:flex;background:#38333a;border-radius:999px;padding:3px;margin-left:auto}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;color:#ddd}
.seg button.on{background:#fff;color:var(--ink);font-weight:700}

/* ---------- layout ---------- */
.stage{display:flex;justify-content:center;min-height:100vh;min-height:100dvh}
.phone{width:100%;max-width:480px;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(40,10,30,.12)}
.phone.tab{max-width:1024px}
@media (max-width:520px){.phone{box-shadow:none}}
.wide{width:100%;max-width:1180px}

.appbar{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);position:sticky;top:0;z-index:5}
.appbar h1{font-size:19px;margin:0;font-weight:800}
.appbar .sub{font-size:12px;color:var(--mute)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);font-size:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 9px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.price{background:var(--peach);border-color:var(--peach-d);color:var(--brand-d);font-weight:700}
.scroll{flex:1;overflow:auto;padding:0 16px 110px}

/* tabs at bottom */
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 0;border-radius:10px;position:relative}
.tabbar button .i{font-size:20px;line-height:1}
.tabbar button.on{color:var(--brand)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:700}

/* login */
.login{overflow:auto;padding:calc(30px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column;gap:14px;flex:1;background:linear-gradient(180deg,#fff 0%,var(--peach) 100%)}
.login h2{font-size:28px;margin:10px 0 0;line-height:1.25}
.login p{color:var(--ink2);margin:0 0 12px;line-height:1.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--ink2);font-weight:600}
.field input,.field select,.field textarea{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:15px}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:disabled{background:#e3b8c8;cursor:not-allowed}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn.ghost{color:var(--brand)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:#fff;border:1px solid #f1c0c0;color:var(--bad)}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:12px}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--peach-d)}
.note{font-size:12px;color:var(--mute);line-height:1.6}
.cover-h{padding:18px 0 8px}
.cover-h h2{font-size:34px;margin:10px 0 6px;line-height:1.2;letter-spacing:1px}
.cover-h p{margin:0}
.cover-badge{display:inline-block;background:var(--ink);color:#fff;font-weight:800;letter-spacing:2px;font-size:12px;padding:4px 10px;border-radius:6px}
.choice{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:16px;padding:18px 16px;box-shadow:var(--sh);border:1px solid var(--line)}
.choice:hover{border-color:var(--brand)}
.choice .ic{font-size:30px}
.choice b{display:block;font-size:17px}
.choice small{display:block;color:var(--mute);font-size:12px;margin-top:3px}
.choice .arr{margin-left:auto;font-size:24px;color:var(--brand)}
.idhint{font-size:12px;color:var(--ok);min-height:16px;margin-top:-8px}
details.note summary{cursor:pointer;color:var(--brand)}

/* home */
.hello{margin:4px 0 14px;font-size:14px;color:var(--ink2)}
.storecard{display:flex;gap:14px;align-items:center;background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh);text-align:left;width:100%}
.storecard .em{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:30px;flex:none}
.storecard h3{margin:0;font-size:17px}
.storecard .en{font-size:12px;color:var(--mute)}
.storecard .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.sect-h{font-size:13px;color:var(--mute);font-weight:700;margin:18px 0 8px;letter-spacing:.3px}

/* menu */
.cats{display:flex;gap:8px;overflow:auto;padding:4px 16px 10px;position:sticky;top:0;background:var(--bg);z-index:4;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{white-space:nowrap;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.cats button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px}
.cat-h h4{margin:0;font-size:16px}
.cat-h span{font-size:12px;color:var(--mute)}
.cat-note{font-size:12px;color:var(--ink2);background:var(--peach);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04);width:100%;text-align:left}
.item .nm{font-weight:700;font-size:15px;line-height:1.35}
.item .en{font-size:12px;color:var(--mute);margin-top:2px}
.item .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.tg{font-size:11px;padding:2px 7px;border-radius:6px;background:#f2eef0;color:var(--ink2)}
.tg.veg{background:var(--ok-bg);color:var(--ok)}
.tg.hot{background:var(--bad-bg);color:var(--bad)}
.tg.lim{background:var(--warn-bg);color:var(--warn)}
.item .pr{margin-left:auto;text-align:right;flex:none}
.item .pr b{font-size:17px}
.item .pr .alt{display:block;font-size:11px;color:var(--mute)}
.item.sold{opacity:.45}
.item.sold .pr b{font-size:13px;color:var(--bad)}
.addplus{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;font-size:20px;line-height:30px;text-align:center;margin:6px 0 0 auto;display:block}
.builder-cta{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;border-radius:var(--r);background:var(--ink);color:#fff;margin:6px 0 4px}
.builder-cta .em{font-size:30px}
.builder-cta b{font-size:16px}
.builder-cta span{font-size:12px;opacity:.75;display:block}
.promo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:#7a4b0c;font-size:13px;margin:6px 0;line-height:1.5}

/* sheet */
.overlay{position:absolute;inset:0;background:rgba(20,10,20,.45);z-index:20;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;max-height:88%;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.sheet.anim{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .hd{padding:16px 18px 8px;display:flex;gap:10px;align-items:flex-start}
.sheet .hd h3{margin:0;font-size:18px;line-height:1.35}
.sheet .bd{padding:4px 18px 14px;overflow:auto}
.sheet .ft{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.grp{margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.grp b{font-size:14px}
.grp span{font-size:12px;color:var(--mute)}
.grp span.req{color:var(--brand);font-weight:700}
.grp span.okk{color:var(--ok);font-weight:700}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #f4f0f2;width:100%;text-align:left}
.opt .x{flex:1}
.opt .x small{display:block;color:var(--mute);font-size:11px}
.box{width:22px;height:22px;border-radius:6px;border:2px solid #d8d0d4;display:grid;place-items:center;flex:none;font-size:13px;color:#fff}
.box.round{border-radius:50%}
.opt.on .box{background:var(--brand);border-color:var(--brand)}
.opt.dis{opacity:.4}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);font-size:16px;line-height:1;background:#fff}
.stepper span{min-width:18px;text-align:center;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick{padding:9px 6px;border-radius:10px;border:1px solid var(--line);font-size:13px;background:#fff;text-align:center;line-height:1.25}
.pick small{display:block;font-size:10px;color:var(--mute)}
.pick.on{border-color:var(--brand);background:#fff0f5;color:var(--brand-d);font-weight:700}
.pick.dis{opacity:.4}
.qty{display:flex;align-items:center;gap:10px}

/* cart */
.cgroup{background:#fff;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.cgroup h4{margin:0 0 6px;font-size:15px;display:flex;justify-content:space-between}
.cline{display:flex;gap:10px;padding:9px 0;border-top:1px solid #f4f0f2;align-items:flex-start}
.cline:first-of-type{border-top:0}
.cline .x{flex:1;font-size:14px}
.cline .x small{display:block;color:var(--mute);font-size:12px;line-height:1.5;margin-top:2px}
.cline .p{font-weight:700;font-size:14px}
.gift{color:var(--warn);font-size:12px;font-weight:700}
.sum{display:flex;justify-content:space-between;font-size:14px;padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:60px 10px}
.empty .big{font-size:48px}

/* slots */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.slot{padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;text-align:center;line-height:1.3}
.slot small{display:block;font-size:10px;color:var(--mute)}
.slot.on{border-color:var(--brand);background:var(--brand);color:#fff}
.slot.on small{color:#ffd6e5}
.slot.full{background:#f4f0f2;color:#b8b0b4;cursor:not-allowed;text-decoration:line-through}
.slot.low small{color:var(--warn);font-weight:700}

/* orders */
.ocard{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.ocard .top{display:flex;align-items:center;gap:12px}
.ocard .no{font-size:28px;font-weight:800;letter-spacing:1px}
.ocard .st{margin-left:auto}
.stbadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f2eef0;color:var(--ink2)}
.stbadge.SUBMITTED{background:#eef2ff;color:#3b4fb5}
.stbadge.ACCEPTED{background:var(--warn-bg);color:var(--warn)}
.stbadge.READY{background:var(--ok);color:#fff}
.stbadge.PICKED_UP{background:var(--ok-bg);color:var(--ok)}
.stbadge.CANCELLED,.stbadge.REJECTED,.stbadge.NO_SHOW{background:var(--bad-bg);color:var(--bad)}
.timeline{display:flex;margin:14px 0 6px}
.timeline div{flex:1;text-align:center;font-size:11px;color:var(--mute);position:relative;padding-top:16px}
.timeline div:before{content:"";position:absolute;top:4px;left:50%;width:10px;height:10px;border-radius:50%;background:#e2dbdf;transform:translateX(-50%)}
.timeline div:after{content:"";position:absolute;top:8px;left:calc(50% + 7px);right:calc(-50% + 7px);height:2px;background:#e2dbdf}
.timeline div:last-child:after{display:none}
.timeline div.done{color:var(--ink)}
.timeline div.done:before{background:var(--ok)}
.timeline div.done:after{background:var(--ok)}
.qrwrap{display:flex;gap:14px;align-items:center;margin-top:10px;padding:10px;background:var(--bg);border-radius:12px}
.qrwrap svg{width:96px;height:96px;flex:none;background:#fff;border-radius:6px}
.kv{font-size:13px;color:var(--ink2);line-height:1.7}
.kv b{color:var(--ink)}

/* toast */
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:92vw;animation:up .2s}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}

/* ---------- vendor ---------- */
.vwrap{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(40,10,30,.12);overflow:hidden}
.vhead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.vhead h2{margin:0;font-size:20px}
.vhead select{padding:9px 12px;border-radius:10px;border:1px solid var(--line);font-weight:700}
.vtabs{display:flex;gap:4px;margin-left:auto}
.vtabs button{padding:8px 14px;border-radius:10px;font-size:14px;color:var(--ink2)}
.vtabs button.on{background:var(--peach);color:var(--brand-d);font-weight:700}
.vbody{padding:16px 20px 24px;background:var(--bg);min-height:560px}
.kcols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:860px){.kcols{grid-template-columns:1fr}}
.kcol h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
.kcol h3 .n{background:var(--ink);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px}
.kcard{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:0}
.kcard .h{display:flex;align-items:center;gap:8px}
.kcard .h .no{font-size:22px;font-weight:800}
.kcard .h .slotlbl{margin-left:auto;font-weight:700;font-size:13px;background:var(--peach);color:var(--brand-d);padding:3px 8px;border-radius:8px}
.kcard ul{margin:8px 0;padding-left:18px;font-size:13px;line-height:1.6}
.kcard ul small{color:var(--mute)}
.kcard .act{display:flex;gap:6px;flex-wrap:wrap}
.kcard .who{font-size:12px;color:var(--mute)}
.vtool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.vtool input{padding:9px 12px;border-radius:10px;border:1px solid var(--line);width:160px}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13px}
table.t th{background:var(--ink);color:#fff;text-align:left;padding:9px 10px;font-weight:600}
table.t td{padding:8px 10px;border-top:1px solid #f1ecef;vertical-align:middle}
table.t tr:nth-child(even) td{background:#fcfafb}
table.t input.p{width:64px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right}
.toggle{width:44px;height:24px;border-radius:12px;background:#d9d2d6;position:relative;transition:.15s}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on{background:var(--bad)}
.toggle.on:after{left:23px}
.warnrow td{background:var(--warn-bg)!important}
.cards3{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:860px){.cards3{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat b{font-size:28px;display:block}
.stat span{font-size:12px;color:var(--mute)}
.heat td.c{text-align:center;font-weight:700}

/* demo clock */
.clock{position:fixed;right:16px;bottom:16px;z-index:40;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.clock b{font-size:16px;font-variant-numeric:tabular-nums}
.clock input{padding:5px 6px;border:1px solid var(--line);border-radius:8px}
.clock button{padding:5px 8px;border-radius:8px;background:var(--bg);font-size:12px}
.clock .lbl{font-size:11px;color:var(--mute)}
@media (max-width:520px){.topbar{padding:8px 10px;gap:8px}.topbar .tag{display:none}.who .me{display:none}.mswitch{font-size:11px}.seg button{padding:5px 10px;font-size:12px}.clock{right:8px;bottom:78px;padding:5px 9px;border-radius:10px}.clock b{font-size:13px}.clock button,.clock input,.clock .lbl{display:none}}

/* ---------- app components ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.pill.light{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.qseg{display:flex;background:#eee7ea;border-radius:12px;padding:3px;margin:4px 0 12px}
.qseg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--ink2)}
.qseg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.qseg .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px}
.kcol{display:none}.kcol.sel{display:block}
@media (min-width:760px){.phone.tab .qseg{display:none}.phone.tab .kcols{grid-template-columns:repeat(3,1fr)}.phone.tab .kcol{display:block}}
.kcols{display:grid;gap:12px;grid-template-columns:1fr}
.mrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.mrow .x{flex:1;min-width:0}
.mrow .x b{display:block;font-size:14px;line-height:1.35}
.mrow .x small{display:block;color:var(--mute);font-size:11px}
.mrow input.p{width:58px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:right}
.mrow .pl{font-size:10px;color:var(--mute);text-align:center}
.mrow.warn{background:var(--warn-bg)}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.card h4{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
.fgrid>*{min-width:0}
.fgrid .field input,.fgrid .field select{width:100%;min-width:0}
.kcol h3{display:none}
@media (min-width:760px){.phone.tab .kcol h3{display:flex}}
.irow input{min-width:0}
.ihead{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:6px;font-size:11px;color:var(--mute);padding:2px 2px 0}
.fgrid .field input,.fgrid .field select{padding:9px 11px;border-radius:10px}
.irow{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-top:1px solid #f1ecef}
.irow:first-of-type{border-top:0}
.irow input{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.irow .full{grid-column:1/-1}
.irow .p3{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:6px;grid-column:1/-1;align-items:center}
.irow.warn{background:var(--warn-bg);border-radius:8px;padding:10px 6px}
.xscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
.xscroll table.t{min-width:520px}
.cards3{grid-template-columns:repeat(2,1fr)!important}
@media (min-width:760px){.phone.tab .cards3{grid-template-columns:repeat(4,1fr)!important}}
.clockrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clockrow .big{font-size:24px;font-variant-numeric:tabular-nums;margin-right:6px}
.clockrow input{padding:6px;border:1px solid var(--line);border-radius:8px}
.clockrow button{padding:6px 10px;border-radius:8px;background:var(--bg);font-size:13px;border:1px solid var(--line)}
.setrow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid #f1ecef}
.setrow:first-child{border-top:0}
.setrow .x{flex:1}
.setrow .x small{display:block;color:var(--mute);font-size:12px}
.installtip{font-size:12px;color:var(--ink2);background:var(--peach);border-radius:10px;padding:10px 12px;line-height:1.6}
</style>
</head>

<div class="stage" id="stage"></div>



<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STORE_ICON={thai:'🍛',ramen:'🍜',mala:'🌶️',daka:'☕',daosui:'🥗'};

const bgc=sid=>({thai:'#fde9d9',ramen:'#f6efe0',mala:'#fde3e3',daka:'#efe7df',daosui:'#e4f3e6'}[sid]||'#eef0f6');

const storeById=id=>stores.find(s=>s.id===id);
function rebuildCatalog(){
  if(!DB.catalog||DB.catalogSig!==MENU_SIG){DB.catalog=JSON.parse(JSON.stringify(MENU.stores)); DB.catalogSig=MENU_SIG; save();}
  stores=DB.catalog; allItems={};
  stores.forEach(s=>{s.categories.forEach(c=>c.items.forEach(it=>{allItems[it.id]={...it,store:s.id,cat:c.id};})); Object.values(s.addonGroups||{}).forEach(g=>g.items.forEach(it=>{allItems[it.id]={...it,store:s.id,addon:true};}));});
  S.cart=S.cart.filter(l=>l.kind==='bowl'||allItems[l.id]);
}
function item(id){const it=allItems[id]||{name:'（已下架品項）',en:'',campus:0,off:0,tags:[]}; const o=DB.overrides[id]||{}; return {...it,...o};}
function cfg(sid){const s=storeById(sid); return {prepMin:s.prepMin,slotCap:s.slotCap,...(DB.storeCfg[sid]||{})};}
const priceType=()=>S.user&&S.user.type==='visitor'?'off':'campus';
const P=it=>priceType()==='off'?it.off:it.campus;
const money=n=>'$'+n;
const T=(zh,en)=>S.lang==='en'&&en?en:zh;

/* time (demo clock) */
function now(){const d=new Date(); if(DB.clockOffsetMin!=null){const t=new Date(); t.setHours(0,0,0,0); return new Date(t.getTime()+DB.clockOffsetMin*60000);} return d;}
const minOf=d=>d.getHours()*60+d.getMinutes();
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function windows(s){return s.open.split(',').map(w=>{const [a,b]=w.trim().split('-'); const f=x=>{const [h,m]=x.split(':').map(Number); return h*60+m}; return [f(a),f(b)];});}
function isOpen(s,m=minOf(now())){return windows(s).some(([a,b])=>m>=a&&m<b);}
function slotsFor(sid){
  const s=storeById(sid), c=cfg(sid), m=minOf(now()), earliest=m+c.prepMin, out=[];
  windows(s).forEach(([a,b])=>{
    let st=Math.max(a,Math.ceil(earliest/10)*10);
    st=Math.ceil(st/10)*10;
    for(let t=st;t+10<=b && out.length<12;t+=10){ const used=bookedCount(sid,t); out.push({t,used,cap:c.slotCap,full:used>=c.slotCap}); }
  });
  return out;
}
const ACTIVE=['SUBMITTED','ACCEPTED','READY','PICKED_UP','NO_SHOW'];
const today=()=>{const d=now(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function bookedCount(sid,t){return DB.orders.filter(o=>o.store===sid&&o.slot===t&&o.day===today()&&ACTIVE.includes(o.status)).length;}
function rid(){const a=new Uint8Array(16); (crypto.getRandomValues?crypto.getRandomValues(a):a.forEach((_,i)=>a[i]=Math.random()*256|0)); return [...a].map(x=>x.toString(16).padStart(2,'0')).join('');}

/* ================= cart model ================= */
// line: {key, store, kind:'item'|'bowl', id, qty, addons:[id], choice, broth, pick4:[name], extras:{id:qty}}
function linePrice(l){
  if(l.kind==='bowl'){
    const b=storeById('mala').builder; let p=0;
    if(l.pick4&&l.pick4.length===4) p+= priceType()==='off'?b.pick4.off:b.pick4.campus;
    Object.entries(l.extras||{}).forEach(([id,q])=>p+=P(item(id))*q);
    return p*l.qty;
  }
  const it=item(l.id); let p=P(it); (l.addons||[]).forEach(a=>p+=P(item(a))); return p*l.qty;
}
function lineDesc(l){
  if(l.kind==='bowl'){
    const parts=['湯底：'+l.broth];
    if(l.pick4&&l.pick4.length) parts.push('任選4：'+l.pick4.join('、'));
    const ex=Object.entries(l.extras||{}).map(([id,q])=>item(id).name+(q>1?'×'+q:'')); if(ex.length) parts.push(ex.join('、'));
    return parts;
  }
  const out=[]; if(l.broth) out.push('湯底：'+l.broth); if(l.choice) out.push('口味：'+l.choice); (l.addons||[]).forEach(a=>out.push('＋'+item(a).name+' '+money(P(item(a))))); return out;
}
function lineName(l){return l.kind==='bowl'?'🥣 我的組合麻辣燙':T(item(l.id).name,item(l.id).en);}
function cartByStore(){const g={}; S.cart.forEach(l=>{(g[l.store]=g[l.store]||[]).push(l)}); return g;}
function cartCount(){return S.cart.reduce((a,l)=>a+l.qty,0);}

/* promotions (DAKA, before 10:00 by submit time) */
function promosFor(sid,lines,at=now()){
  const s=storeById(sid); if(!s.promotions) return [];
  const m=minOf(at), out=[];
  s.promotions.forEach(p=>{
    const [h,mm]=p.before.split(':').map(Number); if(m>=h*60+mm) return;
    let n=0;
    lines.forEach(l=>{ if(l.kind!=='item') return; const it=item(l.id);
      if(p.triggerMatch && p.triggerMatch.some(k=>it.name.includes(k))) n+=l.qty;
      if(p.triggerPromoTag && it.promoTag===p.triggerPromoTag) n+=l.qty; });
    if(n>0) out.push({promo:p,count:n});
  });
  return out;
}

/* ================= notifications between tabs ================= */
function snapshotStatuses(){const m={}; DB.orders.forEach(o=>m[o.id]=o.status); return m;}
function notifyChanges(before){
  if(S.role!=='student'||!S.user) return;
  DB.orders.filter(o=>o.user===S.user.id).forEach(o=>{
    if(before[o.id]&&before[o.id]!==o.status){
      if(o.status==='READY') toast(`🔔 訂單 ${o.no}（${storeById(o.store).name}）可取餐了！`,'ok',5000);
      else if(o.status==='ACCEPTED') toast(`訂單 ${o.no} 店家已接單，製作中`);
      else if(o.status==='REJECTED') toast(`訂單 ${o.no} 被店家拒絕：${o.rejectReason||''}`,'bad',5000);
      else if(o.status==='NO_SHOW') toast(`訂單 ${o.no} 已標記為未取餐`,'bad');
    }
  });
}
let toastTimer;
function toast(msg,kind='',ms=2600){let t=$('#toast'); if(!t){t=document.createElement('div'); t.id='toast'; document.body.appendChild(t);} t.className='toast '+kind; t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),ms);}

let lastViewKey='';
function currentRole(){if(S.user&&S.user.type==='vendor') return 'vendor'; if(S.user&&S.user.admin&&S.editMode) return 'manage'; return 'student';}
let _rendering=false,_pending=false;
function render(){
  if(_rendering){_pending=true; return;}
  _rendering=true;
  try{ _renderOuter(); } finally { _rendering=false; }
  if(_pending){_pending=false; render();}
}
function _renderOuter(){
  rebuildCatalog(); S.role=currentRole();
  const vk=S.role+'|'+(S.mTab||'')+'|'+(S.mStore||'')+'|'+S.view+'|'+S.storeId+'|'+S.vendorTab+'|'+S.vendorStore+'|'+(S.sheet?S.sheet.type+(S.sheet.id||''):'');
  const keep=vk===lastViewKey; const sc={}; if(keep) document.querySelectorAll('.scroll,.sheet .bd').forEach((el,i)=>sc[i]=el.scrollTop); const wy=window.scrollY;
  S.anim=!keep; lastViewKey=vk;
  _render();
  if(keep){document.querySelectorAll('.scroll,.sheet .bd').forEach((el,i)=>{if(sc[i]!=null) el.scrollTop=sc[i];}); window.scrollTo(0,wy);}
}
function _render(){
  const st=$('#stage');
  if(S.role==='student') st.innerHTML=`<div class="phone" id="phone">${renderStudent()}</div>`;
  else if(S.role==='vendor') st.innerHTML=`<div class="phone tab" id="phone">${renderVendor()}</div>`;
  else st.innerHTML=`<div class="phone tab" id="phone">${renderManage()}</div>`;
  saveSession();
}

const DEPTS={'01':'工業管理系','02':'電子工程系','03':'機械工程系','04':'材料科學與工程系','05':'營建工程系','06':'化學工程系','07':'電機工程系','08':'企業管理系','09':'資訊管理系','10':'設計系','11':'數位學習與教育研究所','12':'自動化及控制研究所','13':'建築系','15':'資訊工程系','16':'管理研究所','17':'應用外語系','18':'財務金融研究所','19':'光電工程研究所','20':'科技管理研究所','21':'管理學院 MBA','22':'應用科技研究所','23':'醫學工程研究所','24':'專利研究所','25':'色彩與照明科技研究所','26':'資訊安全科技與管理碩士班','30':'不分系學士班','31':'工程學士班','32':'電資學士班','33':'管理學士班','34':'創意設計學士班','51':'智慧製造科技研究所','52':'人工智慧跨域科技研究所','53':'能源永續科技研究所','54':'先進半導體科技研究所'};
const DEPT_SHORT={'01':'工管系','02':'電子系','03':'機械系','04':'材料系','05':'營建系','06':'化工系','07':'電機系','08':'企管系','09':'資管系','10':'設計系','13':'建築系','15':'資工系','17':'應外系'};
const LEVEL={B:{name:'大學部',pre:'大'},M:{name:'碩士班',pre:'碩'},D:{name:'博士班',pre:'博'}};
// 模擬校務系統資料（原型示範用，非真實資料）。正式系統改由校園 SSO 驗證，不在本系統儲存身分證字號。
const DIRECTORY={
  'B11201116':{id:'B000000000',name:'陳庭瑜'},
  'M11407021':{id:'F000000004',name:'林家豪'},
  'T10234':{id:'A000000009',name:'王美玲',unit:'總務處',title:'職員',admin:true}
};
function acadYear(d=new Date()){const y=d.getFullYear()-1911; return d.getMonth()>=7?y:y-1;}
const CN=['','一','二','三','四','五','六','七','八','九'];
function parseStudentNo(no){
  if(!/^[A-Z]\d{8}$/.test(no)) return {err:'學號格式應為 1 個英文字母＋8 位數字，例如 B11201116'};
  const lv=no[0]; if(!LEVEL[lv]) return {err:'學號第 1 碼應為 B（大學部）、M（碩士）或 D（博士）'};
  const entry=parseInt(no.slice(1,4),10), code=no.slice(4,6);
  if(!DEPTS[code]) return {err:`學號第 5～6 碼「${code}」不是有效的系所代碼`};
  const g=acadYear()-entry+1;
  const short=DEPT_SHORT[code]||DEPTS[code];
  return {level:lv,levelName:LEVEL[lv].name,entry,code,dept:DEPTS[code],short,grade:g,
    gradeLabel:g>=1&&g<=9?`${short} ${LEVEL[lv].pre}${CN[g]}`:`${short}（${entry} 學年入學）`};
}
function validTwId(id){
  if(!/^[A-Z]\d{9}$/.test(id)) return false;
  const L='ABCDEFGHJKLMNPQRSTUVXYWZIO'.indexOf(id[0])+10;
  const d=[Math.floor(L/10),L%10,...id.slice(1).split('').map(Number)];
  const w=[1,9,8,7,6,5,4,3,2,1,1];
  return d.reduce((a,x,i)=>a+x*w[i],0)%10===0;
}

function idHint(no){
  no=no.toUpperCase();
  if(/^[BMD]/.test(no)&&no.length===9){const p=parseStudentNo(no); return p.err?`<span style="color:var(--bad)">${esc(p.err)}</span>`:`${esc(p.levelName)} · ${esc(p.dept)} · ${p.entry} 學年入學`;}
  return '';
}
function memberLogin(){
  const no=($('#ssoNo').value||'').trim().toUpperCase(), idn=($('#ssoId').value||'').trim().toUpperCase();
  S.loginNo=no; S.loginErr='';
  let info=null;
  if(/^[BMD]/.test(no)){const p=parseStudentNo(no); if(p.err){S.loginErr=p.err; render(); return;} info=p;}
  else if(!/^T\d{5}$/.test(no)){S.loginErr='請輸入學號（B／M／D 開頭）或教職員編號'; render(); return;}
  if(!validTwId(idn)){S.loginErr='身分證字號格式或檢查碼不正確'; render(); return;}
  const rec=DIRECTORY[no];
  if(!rec||rec.id!==idn){S.loginErr='查無此帳號，或學號與身分證字號不符'; render(); return;}
  const u={id:'m-'+no,type:'member',no,name:rec.name,...(DB.users['m-'+no]||{})};
  if(info){u.role='student'; u.dept=info.dept; u.levelName=info.levelName; u.entry=info.entry; u.gradeLabel=info.gradeLabel;}
  else {u.role='staff'; u.dept=rec.unit; u.gradeLabel=`${rec.unit} ${rec.title}`; u.admin=!!rec.admin;}
  S.user=u; S.loginNo=''; S.loginMode=null; S.view='home'; S.editMode=false; render(); toast(`歡迎，${u.name}（${u.gradeLabel}）${u.admin?' · 右上角可開啟編輯模式':' · 校內價'}`,'ok',3500);
}

function renderCheckout(){
  const g=cartByStore(); const sids=Object.keys(g);
  if(!sids.length){S.view='cart'; return renderCart();}
  S.pick=S.pick||{}; S.gifts=S.gifts||{};
  let allOk=true, total=0;
  const susp=userSusp();
  const html=sids.map(sid=>{const s=storeById(sid), lines=g[sid], sl=slotsFor(sid); const sub=lines.reduce((a,l)=>a+linePrice(l),0); total+=sub;
    if(sl.find(x=>x.t===S.pick[sid]&&x.full)) delete S.pick[sid];
    if(!S.pick[sid]) allOk=false;
    const sold=lines.filter(l=>l.kind==='item'&&(item(l.id).soldOut||(l.addons||[]).some(a=>item(a).soldOut)));
    if(sold.length) allOk=false;
    const promos=promosFor(sid,lines);
    return `<div class="cgroup"><h4><span>${icon(sid)} ${esc(s.name)}</span><span>${money(sub)}</span></h4>
      <div class="note">${lines.map(l=>esc(lineName(l))+'×'+l.qty).join('、')}</div>
      ${sold.length?`<div class="promo" style="background:var(--bad-bg);color:var(--bad)">⚠ ${sold.map(l=>esc(lineName(l))).join('、')} 已售完，請回購物車移除（FR-06）</div>`:''}
      ${promos.map(p=>{const r=p.promo.reward; if(r.choose){const v=S.gifts[sid+p.promo.id]||r.choose[0]; S.gifts[sid+p.promo.id]=v; return `<div class="promo">🎁 <div><b>${esc(p.promo.name)}</b> ×${p.count}<br>贈品口味：${r.choose.map(c=>`<button class="chip ${v===c?'price':''}" data-gift="${sid+p.promo.id}" data-v="${esc(c)}">${esc(c)}</button>`).join(' ')}</div></div>`;} return `<div class="promo">🎁 <div><b>${esc(p.promo.name)}</b> ×${p.count}<br>贈品：${esc(r.fixed)}</div></div>`;}).join('')}
      <div class="grp"><b>取餐時段</b><span>備餐 ${cfg(sid).prepMin} 分 · 每格上限 ${cfg(sid).slotCap} 筆</span></div>
      ${sl.length?`<div class="slots">${sl.map(x=>{const left=x.cap-x.used; return `<button class="slot ${S.pick[sid]===x.t?'on':''} ${x.full?'full':''} ${!x.full&&left<=3?'low':''}" data-slot="${sid}" data-t="${x.t}" ${x.full?'disabled':''}>${hm(x.t)}<small>${x.full?'已滿':'剩 '+left}</small></button>`;}).join('')}</div>`
      :`<div class="promo" style="background:var(--bad-bg);color:var(--bad)">今日已無可選時段（營業時間 ${esc(s.open)}）</div>`}
    </div>`;}).join('');
  if(susp) allOk=false;
  return `<div class="appbar"><button class="iconbtn" data-go="cart">←</button><h1>選擇取餐時段</h1></div>
  <div class="scroll">
    ${susp?`<div class="promo" style="background:var(--bad-bg);color:var(--bad)">⛔ 你的帳號因 30 天內 2 次未取餐，線上點餐暫停至 ${new Date(susp).toLocaleDateString()}（FR-21）</div>`:''}
    ${html}
    <div class="cgroup"><div class="sum"><b>應付（現場付款）</b><b>${money(total)}</b></div>
      <div class="field" style="margin-top:10px"><label>備註（選填）</label><input id="note" placeholder="例：不要香菜、少辣" maxlength="40"></div></div>
    <button class="btn pri" style="width:100%" data-act="submit" ${allOk?'':'disabled'}>${allOk?`送出 ${sids.length} 筆訂單`:'請為每家店選擇取餐時段'}</button>
    <p class="note">送出時系統會再確認一次時段名額；若剛好被別人搶走，會請你改選（FR-13）。</p>
  </div>`;
}
function submitOrders(){
  const g=cartByStore(); const at=now(); const note=($('#note')||{}).value||'';
  if(userSusp()){toast('帳號停權中','bad');return;}
  // re-check capacity & sold out (simulated transaction)
  DB=load()||DB;
  for(const sid of Object.keys(g)){
    const t=S.pick[sid]; const c=cfg(sid);
    if(bookedCount(sid,t)>=c.slotCap){toast(`${storeById(sid).name} ${hm(t)} 剛好額滿，請改選時段`,'bad',4000); delete S.pick[sid]; render(); return;}
    if(g[sid].some(l=>l.kind==='item'&&item(l.id).soldOut)){toast('有品項剛剛售完，請回購物車移除','bad'); render(); return;}
  }
  const created=[];
  Object.keys(g).forEach(sid=>{
    const lines=g[sid].map(l=>({...l,name:lineName(l),desc:lineDesc(l),price:linePrice(l)}));
    const gifts=promosFor(sid,g[sid],at).map(p=>({name:p.promo.reward.choose?(S.gifts[sid+p.promo.id]||p.promo.reward.choose[0]):p.promo.reward.fixed,qty:p.count,promo:p.promo.name}));
    DB.seq=(DB.seq||100)+1;
    const prefix=storeById(sid).prefix||{thai:'T',ramen:'R',mala:'M',daka:'D',daosui:'H'}[sid]||'X';
    const o={id:rid(),no:prefix+String(DB.seq).slice(-3),token:rid(),store:sid,user:S.user.id,userName:S.user.name,priceType:priceType(),
      lines,gifts,total:lines.reduce((a,l)=>a+l.price,0),slot:S.pick[sid],day:today(),status:'SUBMITTED',note,submittedAt:at.toISOString(),history:[{s:'SUBMITTED',at:hm(minOf(at))}]};
    DB.orders.push(o); created.push(o);
  });
  save(); S.cart=[]; S.pick={}; S.gifts={}; S.view='orders'; render();
  toast(`已送出 ${created.length} 筆訂單：${created.map(o=>o.no).join('、')}`,'ok',4000);
}

function renderReport(){
  const os=DB.orders.filter(o=>o.day===today());
  const cnt=st=>os.filter(o=>o.status===st).length;
  const rev=os.filter(o=>o.status==='PICKED_UP').reduce((a,o)=>a+o.total,0);
  const slots=[...new Set(os.map(o=>o.slot))].sort((a,b)=>a-b);
  const max=Math.max(1,...stores.flatMap(s=>slots.map(t=>os.filter(o=>o.store===s.id&&o.slot===t).length)));
  return `<div class="vtool" style="margin-top:4px"><span class="note">今日 ${today()}</span><button class="btn sec sm" style="margin-left:auto" data-act="csv">⬇ 匯出／複製 CSV</button></div>
  <div>
    <div class="cards3"><div class="stat"><b>${os.length}</b><span>今日訂單</span></div><div class="stat"><b>${cnt('PICKED_UP')}</b><span>已取餐</span></div>
      <div class="stat"><b>${cnt('CANCELLED')+cnt('REJECTED')}</b><span>取消／拒絕</span></div><div class="stat"><b>${cnt('NO_SHOW')}</b><span>未取餐（放鳥）</span></div></div>
    <div class="sect-h">各店 × 取餐時段 訂單數（尖峰熱度）</div>
    ${slots.length?`<div class="xscroll"><table class="t heat"><tr><th>店家</th>${slots.map(t=>`<th>${hm(t)}</th>`).join('')}<th>合計</th></tr>
      ${stores.map(s=>{const row=slots.map(t=>os.filter(o=>o.store===s.id&&o.slot===t).length); return `<tr><td>${icon(s.id)} ${esc(s.name)}</td>${row.map(n=>`<td class="c" style="background:rgba(214,51,108,${n/max*0.55})">${n||''}</td>`).join('')}<td class="c">${row.reduce((a,b)=>a+b,0)}</td></tr>`;}).join('')}</table></div>`
      :'<div class="empty">今日尚無訂單。關閉編輯模式下幾筆單，或請店家接單後再回來看。</div>'}
    <div class="sect-h">已取餐營業額（參考）</div><div class="stat"><b>${money(rev)}</b><span>現場收款合計</span></div>
  </div><div style="height:12px"></div>${clockCard()}`;
}
function exportCsv(){
  const rows=[['day','order_no','store','slot','status','price_type','total','submitted_at']].concat(DB.orders.map(o=>[o.day,o.no,storeById(o.store).name,hm(o.slot),o.status,o.priceType,o.total,o.submittedAt]));
  const csv='﻿'+rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(',')).join('\n');
  try{const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='ntust-eats-orders.csv'; document.body.appendChild(a); a.click(); a.remove();}catch(e){}
  try{navigator.clipboard.writeText(csv).then(()=>toast('已下載 CSV，並複製到剪貼簿（可直接貼到 Excel）','ok',4000),()=>toast('已嘗試下載 CSV（若沒有出現，請用本機開啟 prototype/index.html）'));}
  catch(e){toast('已嘗試下載 CSV');}
}

  <div class="card"><h4>＋ 新增分類</h4><div class="vtool" style="margin:0"><input id="ncName" placeholder="分類名稱，例：飲料" style="flex:1;min-width:0"><input id="ncEn" placeholder="English" style="flex:1;min-width:0"><button class="btn sec sm" data-act="addCat">新增</button></div></div>`;
}
function catOf(st,cid){return st.categories.find(c=>c.id===cid);}
function findCatalogItem(id){for(const st of stores) for(const c of st.categories){const it=c.items.find(x=>x.id===id); if(it) return {st,c,it};} return null;}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function addStore(){
  const v=id=>($('#'+id).value||'').trim();
  const name=v('nsName'), en=v('nsEn')||name, open=v('nsOpen'), prep=parseInt(v('nsPrep'),10), cap=parseInt(v('nsCap'),10), pw=v('nsPw')||'0000';
  if(!name){toast('請輸入店名','bad');return;}
  if(stores.some(x=>x.name===name)){toast('已有同名店家','bad');return;}
  if(!OPEN_RE.test(open)){toast('營業時間格式應為 11:00-14:00, 17:00-19:30','bad');return;}
  if(!(prep>=0&&prep<=60&&cap>=1&&cap<=99)){toast('備餐時間或時段上限不合理','bad');return;}
  if(!/^\S{4,12}$/.test(pw)){toast('密碼需 4～12 碼','bad');return;}
  const used=new Set(stores.map(x=>x.prefix||{thai:'T',ramen:'R',mala:'M',daka:'D',daosui:'H'}[x.id]));
  const prefix=[...'ABCEFGJKLNPQSUVWXYZ'].find(ch=>!used.has(ch))||'X';
  const id=newId('st');
  DB.catalog.push({id,name,en,icon:v('nsIcon')||'🍽️',open,prepMin:prep,slotCap:cap,prefix,singlePrice:$('#nsMode').value==='single',
    categories:[{id:newId('c'),name:'主餐',en:'Main',items:[]}]});
  DB.storePw=DB.storePw||{}; DB.storePw[id]=pw; save(); S.mStore=id; S.mTab='menu'; S.showAdd=false; render(); toast(`已新增「${name}」，接著設定菜單`,'ok');
}

/* ================= actions ================= */
function setStatus(id,to,extra={}){
  DB=load()||DB; const o=DB.orders.find(x=>x.id===id); if(!o) return;
  o.status=to; Object.assign(o,extra); (o.history=o.history||[]).push({s:to,at:hm(minOf(now()))});
  if(to==='NO_SHOW') applyNoShow(o.user);
  save(); render();
}
function applyNoShow(uid){
  const u=DB.users[uid]||{}; const n=DB.orders.filter(o=>o.user===uid&&o.status==='NO_SHOW').length;
  if(n>=2){const d=now(); d.setDate(d.getDate()+14); u.suspendedUntil=d.toISOString(); DB.users[uid]=u; if(S.user&&S.user.id===uid) S.user.suspendedUntil=u.suspendedUntil;}
}
function noShowCheck(){
  const m=minOf(now()); let n=0;
  DB.orders.forEach(o=>{if(o.status==='READY'&&o.day===today()&&m>o.slot+10+30){o.status='NO_SHOW'; n++; applyNoShow(o.user);}});
  save(); render(); toast(n?`已標記 ${n} 筆未取餐`:'沒有逾時未取的訂單（時段結束 +30 分才算）');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-act],.overlay'); if(!t) return;
  const d=t.dataset;
  if(t.classList.contains('overlay')&&e.target!==t) return;
  if(d.mtab){S.mTab=d.mtab; render(); return;}
  if(d.qseg){S.qSeg=d.qseg; render(); return;}
  if(d.editmenu){S.mStore=d.editmenu; S.mTab='menu'; render(); return;}
  if(d.resetpw){DB.storePw=DB.storePw||{}; DB.storePw[d.resetpw]='0000'; save(); render(); toast('已重設為 0000'); return;}
  if(d.delitem){if(S.delArm!=='i'+d.delitem){S.delArm='i'+d.delitem; render(); return;} const f=findCatalogItem(d.delitem); if(f){f.c.items=f.c.items.filter(x=>x.id!==d.delitem); delete DB.overrides[d.delitem]; save();} S.delArm=null; render(); toast('已刪除品項'); return;}
  if(d.delcat){if(S.delArm!=='c'+d.delcat){S.delArm='c'+d.delcat; render(); return;} const st=storeById(S.mStore); if(st.categories.length<=1){toast('至少要保留一個分類','bad'); S.delArm=null; render(); return;} st.categories=st.categories.filter(c=>c.id!==d.delcat); save(); S.delArm=null; render(); toast('已刪除分類'); return;}
  if(d.additem){const cid=d.additem, st=storeById(S.mStore), c=catOf(st,cid); const g=k=>{const el=document.getElementById(`ni-${k}-${cid}`); return el?el.value.trim():'';};
    const name=g('name'), cp=parseInt(g('c'),10), op=st.singlePrice?cp:parseInt(g('o')||g('c'),10);
    if(!name){toast('請輸入品名','bad');return;} if(!(cp>0)){toast('請輸入價格','bad');return;} if(!st.singlePrice&&!(op>=cp)){toast('校外價不得低於校內價（FR-10）','bad');return;}
    c.items.push({id:newId(st.id+'-'),name,en:g('en')||name,campus:cp,off:op,tags:g('t')?g('t').split(/[,，、]\s*/).filter(Boolean):[]}); save(); render(); const w=st.singlePrice?'':priceWarn(cp,op); w?toast('⚠ 已新增，但'+w,'bad',4500):toast(`已新增「${name}」，學生端立即可點`,'ok'); return;}
  if(d.mode!==undefined&&t.hasAttribute('data-mode')){S.loginMode=d.mode||null; S.loginErr=''; render(); return;}
  if(d.clock){ if(d.clock==='real'){DB.clockOffsetMin=null;} else {const [h,m]=d.clock.split(':').map(Number); DB.clockOffsetMin=h*60+m;} save(); render(); return; }
  if(d.go){S.view=d.go; S.sheet=null; render(); $('#phone .scroll')&&($('#phone .scroll').scrollTop=0); return;}
  if(d.store){S.storeId=d.store; S.view='store'; render(); return;}
  if(d.jump){const el=document.getElementById('cat-'+d.jump); const sc=$('#menuScroll'); if(el&&sc) sc.scrollTo({top:el.offsetTop-sc.offsetTop-6,behavior:'smooth'}); document.querySelectorAll('.cats button').forEach(b=>b.classList.toggle('on',b===t)); return;}
  if(d.item){openItem(d.item); return;}
  if(d.del){S.cart=S.cart.filter(l=>l.key!==d.del); render(); return;}
  if(d.cancel){const o=DB.orders.find(x=>x.id===d.cancel); if(o&&o.status==='SUBMITTED'){setStatus(o.id,'CANCELLED'); toast('已取消，時段名額已釋放');} else toast('店家已接單，無法取消','bad'); return;}
  if(d.slot){S.pick[d.slot]=Number(d.t); render(); return;}
  if(d.gift){S.gifts[d.gift]=d.v; render(); return;}
  if(d.vtab){S.vendorTab=d.vtab; render(); return;}
  if(d.vs){setStatus(d.vs,d.to); if(d.to==='READY') toast('已推播通知學生取餐','ok'); return;}
  if(d.reject){setStatus(d.reject,'REJECTED',{rejectReason:d.r}); toast('已拒絕並通知學生'); return;}
  if(d.sold){DB.overrides[d.sold]={...(DB.overrides[d.sold]||{}),soldOut:!item(d.sold).soldOut}; save(); render(); toast(item(d.sold).soldOut?'已設為售完，學生端立即不可點':'已恢復供應'); return;}
  // sheet controls
  const sh=S.sheet;
  if(sh){
    if(d.broth){sh.broth=d.broth; render(); return;}
    if(d.choice){sh.choice=d.choice; render(); return;}
    if(d.addon){const i=sh.addons.indexOf(d.addon); i>=0?sh.addons.splice(i,1):sh.addons.push(d.addon); render(); return;}
    if(d.q){sh.qty=Math.max(1,Math.min(9,sh.qty+Number(d.q))); render(); return;}
    if(d.p4){const i=sh.pick4.indexOf(d.p4); if(i>=0) sh.pick4.splice(i,1); else if(sh.pick4.length<4) sh.pick4.push(d.p4); else toast('任選 4 個已滿，先取消一個'); render(); return;}
    if(d.ex){const q=(sh.extras[d.ex]||0)+Number(d.d); if(q<=0) delete sh.extras[d.ex]; else sh.extras[d.ex]=Math.min(9,q); render(); return;}
  }
  switch(d.act){
    case 'sso': memberLogin(); break;
    case 'visitor':{const ph=$('#vPhone').value.replace(/\D/g,''); if(!/^09\d{8}$/.test(ph)){S.loginErr='手機號碼格式不正確（09 開頭共 10 碼）'; render(); return;} S.loginErr=''; S.loginMode=null; S.user={id:'v-'+ph,type:'visitor',phone:ph,name:'訪客'+ph.slice(-3),...(DB.users['v-'+ph]||{})}; S.view='home'; render(); toast('訪客登入：以校外價計','ok'); break;}
    case 'logout': S.user=null; S.cart=[]; S.view='home'; S.editMode=false; S.loginMode=null; render(); break;
    case 'editmode': S.editMode=!S.editMode; S.view='home'; S.mTab=S.mTab||'stores'; render(); toast(S.editMode?'已開啟編輯模式':'已關閉編輯模式，回到點餐畫面'); break;
    case 'addStore': addStore(); break;
    case 'toggleAdd': S.showAdd=!S.showAdd; render(); break;
    case 'addCat':{const n=($('#ncName').value||'').trim(); if(!n){toast('請輸入分類名稱','bad');return;} storeById(S.mStore).categories.push({id:newId('c'),name:n,en:($('#ncEn').value||'').trim()||n,items:[]}); save(); render(); toast('已新增分類','ok'); break;}
    case 'changePw':{const v=($('#newPw').value||'').trim(); if(!/^\S{4,12}$/.test(v)){toast('密碼需 4～12 碼','bad');return;} DB.storePw=DB.storePw||{}; DB.storePw[S.vendorStore]=v; save(); render(); toast('密碼已更新','ok'); break;}
    case 'vendorLogin':{const sid=$('#vSel').value; S.vSel=sid; const _x=0, pw=($('#vPw').value||''); const ok=((DB.storePw||{})[sid]||'0000')===pw; if(!ok){S.loginErr='密碼錯誤'; render(); return;} const st=storeById(sid); S.user={id:'s-'+sid,type:'vendor',store:sid,name:st.name}; S.vendorStore=sid; S.vendorTab='queue'; S.loginMode=null; S.loginErr=''; render(); toast(`${st.name} 已登入`,'ok'); break;}
    case 'lang': S.lang=S.lang==='zh'?'en':'zh'; render(); break;
    case 'reset': if(!S.resetArm){S.resetArm=true; render(); setTimeout(()=>{S.resetArm=false;},4000);} else {S.resetArm=false; DB=fresh(); save(); S.cart=[]; render(); toast('已清除');} break;
    case 'close': S.sheet=null; render(); break;
    case 'bowl': openBowl(); break;
    case 'togglePick4': sh.usePick4=!sh.usePick4; if(!sh.usePick4) sh.pick4=[]; render(); break;
    case 'addItem':{const it=item(sh.id); S.cart.push({key:rid().slice(0,8),store:it.store,kind:'item',id:sh.id,qty:sh.qty,addons:[...sh.addons],choice:sh.choice,broth:sh.broth||undefined}); S.sheet=null; render(); toast(`已加入：${it.name}`,'ok'); break;}
    case 'addBowl': S.cart.push({key:rid().slice(0,8),store:'mala',kind:'bowl',qty:sh.qty,broth:sh.broth,pick4:sh.usePick4?[...sh.pick4]:[],extras:{...sh.extras}}); S.sheet=null; render(); toast('已加入組合麻辣燙','ok'); break;
    case 'submit': submitOrders(); break;
    case 'find':{const no=($('#findNo').value||'').trim().toUpperCase(); const o=DB.orders.find(x=>x.no===no&&x.store===S.vendorStore&&x.day===today()); if(!o) toast('找不到這個號碼（或不是本店訂單）','bad'); else if(o.status==='READY'){setStatus(o.id,'PICKED_UP'); toast(`${o.no} 核對成功，請收 ${money(o.total)}`,'ok',4000);} else toast(`${o.no} 目前狀態：${ST_LABEL[o.status]}`); break;}
    case 'noshowcheck': noShowCheck(); break;
    case 'saveCfg':{const p=parseInt($('#cfgPrep').value,10), c=parseInt($('#cfgCap').value,10); if(!(p>=0&&p<=60&&c>=1&&c<=99)){toast('數值不合理','bad');return;} DB.storeCfg[S.vendorStore]={prepMin:p,slotCap:c}; save(); render(); toast('已儲存','ok'); break;}
    case 'csv': exportCsv(); break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='ssoNo'){const h=document.getElementById('noHint'); if(h) h.innerHTML=idHint(e.target.value.trim());}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='vSel'){S.vSel=t.value; return;}
  if(t.id==='mStore'){S.mStore=t.value; render(); return;}
  if(t.dataset.sf){const st=storeById(t.dataset.sf), k=t.dataset.k, v=t.value.trim();
    if(k==='open'&&!OPEN_RE.test(v)){toast('營業時間格式應為 11:00-14:00, 17:00-19:30','bad'); render(); return;}
    if(k==='prepMin'||k==='slotCap'){const n=parseInt(v,10); if(!(n>=(k==='slotCap'?1:0)&&n<=99)){toast('數值不合理','bad'); render(); return;} DB.storeCfg[st.id]={...cfg(st.id),[k]:n};}
    else { if(!v){toast('不可空白','bad'); render(); return;} st[k]=v; }
    save(); render(); toast('已儲存','ok'); return;}
  if(t.dataset.catf){const c=catOf(storeById(S.mStore),t.dataset.catf); const v=t.value.trim(); if(!v&&t.dataset.k==='name'){toast('分類名稱不可空白','bad'); render(); return;} c[t.dataset.k]=v; save(); render(); toast('已儲存','ok'); return;}
  if(t.dataset.itf){const f=findCatalogItem(t.dataset.itf); if(!f) return; const k=t.dataset.k, v=t.value.trim(), it=f.it, single=!!f.st.singlePrice;
    if(k==='campus'||k==='off'){const n=parseInt(v,10); if(!(n>0)){toast('價格須為正整數','bad'); render(); return;}
      const c=k==='campus'?n:item(it.id).campus, o=single?c:(k==='off'?n:item(it.id).off); if(o<c){toast('校外價不得低於校內價（FR-10）','bad'); render(); return;}
      it.campus=c; it.off=o; if(DB.overrides[it.id]){delete DB.overrides[it.id].campus; delete DB.overrides[it.id].off;}
      save(); render(); const w=single?'':priceWarn(c,o); w?toast('⚠ 已儲存，但'+w,'bad',4500):toast('價格已更新','ok'); return;}
    if(k==='tags') it.tags=v?v.split(/[,，、]\s*/).filter(Boolean):[]; else { if(!v&&k==='name'){toast('品名不可空白','bad'); render(); return;} it[k]=v; }
    save(); render(); toast('已儲存','ok'); return;}
  if(t.id==='clockInput'&&t.value){const [h,m]=t.value.split(':').map(Number); DB.clockOffsetMin=h*60+m; save(); render(); return;}
  if(t.dataset.pc){const id=t.dataset.pc, k=t.dataset.k, v=parseInt(t.value,10); const it=item(id); if(!(v>0)){toast('價格須為正整數','bad'); render(); return;}
    const c=k==='campus'?v:it.campus, o=k==='off'?v:it.off;
    if(o<c){toast('校外價不得低於校內價（FR-10）','bad'); render(); return;}
    const w=priceWarn(c,o);
    DB.overrides[id]={...(DB.overrides[id]||{}),[k]:v}; save(); render(); w?toast('⚠ 已儲存，但'+w+'（FR-10）','bad',5000):toast('價格已更新，學生端立即生效','ok');}
});
// periodic refresh (clock + no-show timing), keeps tabs in sync even without storage events
setInterval(()=>{const before=snapshotStatuses(); const d=load(); if(d){DB=d;} notifyChanges(before); if(!S.sheet && !(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();},5000);
rebuildCatalog();
render();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
